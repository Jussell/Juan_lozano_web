<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crocs | Selector de tallas interactivo</title>
  <style>
    @font-face{font-family:PrototypeNoto;src:url('/fonts/NotoSans-Regular.ttf')}@font-face{font-family:PrototypeNoto;src:url('/fonts/NotoSans-Bold.ttf');font-weight:700}@font-face{font-family:PrototypeNoto;src:url('/fonts/NotoSans-Black.ttf');font-weight:900}
    :root{font-family:PrototypeNoto,Arial,sans-serif;color:#141215;background:#fff;font-synthesis:none;font-optical-sizing:auto;font-size:14px;line-height:1.4}*{box-sizing:border-box}body{margin:0;background:#fff}.prototype{width:100%;max-width:590px;min-height:1224px;margin:0 auto;padding:24px 0 58px;background:#fff}.fit-examples{width:263px;margin:28px 0 76px 48px;display:grid;gap:44px}.fit-choice{display:flex;width:100%;min-height:57px;align-items:center;gap:12px;padding:0 6px;border:1px solid transparent;border-radius:4px;background:transparent;color:inherit;text-align:left;cursor:pointer}.fit-choice:hover,.fit-choice[aria-pressed="true"]{border-color:#bfdda0;background:#fbfdf9}.fit-choice img{width:65.7377px;height:46.468px;object-fit:contain;flex:none}.fit-copy{display:grid;justify-items:center;flex:1;font-size:10px;line-height:1.45}.fit-copy strong{font-size:14px;line-height:1.25}.fit-copy small{font-size:10px;margin-top:3px;white-space:nowrap}.product{width:min(385px,calc(100% - 32px));margin-left:48px;padding:0 8px;display:grid;gap:12px}.color-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px}.color-label{display:flex;gap:8px;align-items:baseline}.color-label strong,.local-size strong{font-weight:700}.store-availability{display:flex;align-items:center;gap:8px;color:#514a54;font-size:13px;white-space:nowrap}.store-availability img{width:16px;height:16px}.price{margin:2px 0 0;font-weight:700}.swatches{display:flex;flex-wrap:wrap;gap:8px}.color-swatch{width:48px;height:48px;position:relative;padding:0;border:1px solid #a2a7a9;border-radius:4px;background:#fff;cursor:pointer}.color-swatch img.product-image{width:100%;height:100%;object-fit:cover;border-radius:4px}.color-swatch[aria-pressed="true"]{border:1px solid #141215}.color-swatch .status-icon{position:absolute;top:3px;left:3px;width:14px;height:14px}.color-swatch .unavailable{position:absolute;inset:2px;width:41px;height:41px;object-fit:contain;opacity:.9}.color-swatch:disabled{cursor:not-allowed}.sale-price{display:flex;gap:3px;margin:0;font-size:14px}.sale-price strong{color:#52a11d}.secondary-swatch{margin-top:0}.size-panel{display:grid;gap:8px;margin-top:2px}.guide-button{display:inline-flex;align-items:center;gap:6px;width:max-content;padding:0;border:0;background:none;color:#514a54;font:inherit;cursor:pointer}.guide-button img{width:16px;height:16px}.fit-summary{display:flex;align-items:center;gap:12px;max-width:260px;min-height:57px}.fit-summary img{width:65.7377px;height:46.468px;object-fit:contain}.fit-summary .fit-copy{white-space:nowrap}.local-size{display:flex;align-items:baseline;gap:8px;min-height:20px}.gender-tabs{display:flex;width:100%;border-bottom:2px solid #eff1f2}.gender-tab{flex:1;height:46px;border:0;border-radius:4px 4px 0 0;background:#fff;font:inherit;cursor:pointer}.gender-tab[aria-pressed="true"]{background:#bfdda0;border-bottom:1px solid #141215}.size-grid{display:flex;flex-wrap:wrap;gap:8px}.size-choice{position:relative;display:grid;place-items:center;width:48px;height:48px;border:1px solid #a2a7a9;border-radius:4px;background:#fff;color:#141215;font:700 14px PrototypeNoto,Arial,sans-serif;cursor:pointer}.size-choice[aria-pressed="true"]{border-color:#141215;background:#141215;color:#fff}.size-choice:disabled{color:#5e6366;cursor:not-allowed}.size-choice:disabled::after{position:absolute;inset:3px;content:"";background:url('/images/crocs-prototype/strikethrough.svg') center/contain no-repeat}.size-choice img{position:absolute;top:3px;left:3px;width:8px;height:8px}.stock-note{display:flex;align-items:center;gap:4px;min-height:40px;padding:8px 16px;border-radius:3px;background:#cce2ed;font-size:16px}.stock-note img{width:24px;height:24px;flex:none}.purchase{display:grid;gap:8px;padding-top:4px}.primary-action{min-height:49px;border:0;border-radius:999px;background:#9fd06e;color:#141215;font:900 20px PrototypeNoto,Arial,sans-serif;cursor:pointer}.primary-action:hover{background:#8bc455}.pickup-action{min-height:49px;border:0;border-radius:999px;background:#fff;color:#141215;font:900 20px PrototypeNoto,Arial,sans-serif;cursor:pointer}.purchase-price{margin:2px 0 0;font-size:20px;font-weight:900}.product-caption{margin:-8px 0 0;font-size:12px;line-height:1.25}.payment{display:flex;align-items:center;gap:10px;min-height:43px;margin-top:4px;padding:5px 12px;border:1px solid #ebeced;white-space:nowrap;font-size:12px}.payment img{width:28px;height:28px}.payment .addi{color:#1768db;font-weight:900}.payment strong{font-weight:700}.payment button,.children-link{padding:0;border:0;background:none;color:#3c6af0;text-decoration:underline;font:inherit;cursor:pointer}.children-link{display:flex;align-items:center;gap:8px;width:max-content;margin-top:2px;color:#141215;font-size:20px;text-decoration:none}.children-link span{font-size:26px}.dialog{width:min(420px,calc(100% - 32px));padding:24px;border:1px solid #d8d3c8;border-radius:8px;background:white;color:#141215;box-shadow:0 20px 60px #0003}.dialog::backdrop{background:#17171780}.dialog h2{margin:0 36px 12px 0;font-size:22px;line-height:1.15}.dialog p{margin:0 0 14px}.dialog-close{float:right;width:32px;height:32px;border:0;border-radius:50%;background:#f2f0eb;font-size:20px;cursor:pointer}.dialog-close:focus-visible,.prototype button:focus-visible{outline:3px solid #4383df;outline-offset:3px}.dialog-action{min-height:40px;padding:8px 16px;border:0;border-radius:999px;background:#9fd06e;font:700 14px PrototypeNoto,Arial,sans-serif;cursor:pointer}.dialog-size{padding:12px;background:#f7f5f0;border-radius:4px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:520px){.prototype{min-height:0;padding-top:18px;padding-bottom:40px}.fit-examples{margin:12px auto 56px;width:min(263px,calc(100% - 36px));gap:30px}.product{margin:0 auto;width:calc(100% - 24px);padding:0}.color-meta{align-items:flex-start;flex-wrap:wrap}.store-availability{font-size:12px}.payment{gap:6px;padding:5px 8px;font-size:11px}.payment img{width:24px;height:24px}.primary-action,.pickup-action{font-size:18px}}
  </style>
</head>
<body>
  <main class="prototype" aria-label="Crocs product size selection demo">
    <section class="fit-examples" aria-label="Fit recommendation examples">
      <button class="fit-choice" type="button" data-fit="snug" aria-pressed="true" aria-label="Select snug fit recommendation">
        <img src="/images/crocs-prototype/fit-width.svg" alt="">
        <span class="fit-copy"><span data-copy="feelsALittle">Se siente un poco</span><strong data-copy="snug">Ajustado</strong><small data-copy="sizeUp">Si estás entre tallas, elige la mayor</small></span>
      </button>
      <button class="fit-choice" type="button" data-fit="roomy" aria-pressed="false" aria-label="Select roomy fit recommendation">
        <img src="/images/crocs-prototype/fit-width.svg" alt="">
        <span class="fit-copy"><span data-copy="feelsALittle">Se siente un poco</span><strong data-copy="roomy">Amplio</strong><small data-copy="sizeDown">Si estás entre tallas, elige la menor</small></span>
      </button>
    </section>

    <section class="product" aria-label="Product options">
      <div class="color-meta">
        <div class="color-label"><strong data-copy="color">Color:</strong><span id="color-name" data-copy="white">Blanco</span></div>
        <div class="store-availability"><img src="/images/crocs-prototype/swatch-check-available.svg" alt=""><span data-copy="pickupAvailable">Disponible para retiro en Fontanar</span></div>
      </div>
      <strong class="price">$84.99</strong>
      <div class="swatches" role="group" aria-label="Color options">
        <button class="color-swatch" type="button" data-color="0" aria-pressed="false" aria-label="White color option"><img class="product-image" src="/images/crocs-prototype/shoe-swatch.png" alt=""></button>
        <button class="color-swatch is-unavailable" type="button" data-color="1" aria-pressed="false" aria-label="Unavailable color option" disabled><img class="product-image" src="/images/crocs-prototype/shoe-swatch.png" alt=""><img class="unavailable" src="/images/crocs-prototype/strikethrough.svg" alt=""></button>
        <button class="color-swatch is-coming-soon" type="button" data-color="2" aria-pressed="false" aria-label="Coming soon color option"><img class="product-image" src="/images/crocs-prototype/shoe-swatch.png" alt=""><img class="status-icon" src="/images/crocs-prototype/swatch-notification.svg" alt=""></button>
        <button class="color-swatch" type="button" data-color="3" aria-pressed="true" aria-label="Selected white color option"><img class="product-image" src="/images/crocs-prototype/shoe-swatch.png" alt=""><img class="status-icon" src="/images/crocs-prototype/swatch-check-selected.svg" alt=""></button>
        <button class="color-swatch" type="button" data-color="4" aria-pressed="false" aria-label="Color option five"><img class="product-image" src="/images/crocs-prototype/shoe-swatch.png" alt=""></button>
        <button class="color-swatch" type="button" data-color="5" aria-pressed="false" aria-label="Color option six"><img class="product-image" src="/images/crocs-prototype/shoe-swatch.png" alt=""><img class="status-icon" src="/images/crocs-prototype/swatch-check-other.svg" alt=""></button>
      </div>
      <p class="sale-price"><strong>$74.99 (20%)</strong><span>$84.99</span></p>
      <div class="swatches secondary-swatch" role="group" aria-label="Additional color option"><button class="color-swatch" type="button" data-color="6" aria-pressed="false" aria-label="Additional white color option"><img class="product-image" src="/images/crocs-prototype/shoe-swatch.png" alt=""></button></div>

      <section class="size-panel" aria-label="Size selection">
        <button class="guide-button" id="open-guide" type="button"><img src="/images/crocs-prototype/size-guide.svg" alt=""><span data-copy="sizeGuide">Guía de tallas</span></button>
        <div class="fit-summary" aria-live="polite"><img src="/images/crocs-prototype/fit-width.svg" alt=""><span class="fit-copy"><span data-copy="feelsALittle">Se siente un poco</span><strong id="fit-summary-label" data-copy="snug">Ajustado</strong><small id="fit-advice" data-copy="sizeUp">Si estás entre tallas, elige la mayor</small></span></div>
        <div class="local-size"><strong data-copy="colombianSize">Talla Colombiana</strong><span id="local-size-value">Mujer 37 (H36 - M37)</span></div>
        <div class="gender-tabs" role="group" aria-label="Size group"><button class="gender-tab" type="button" data-gender="women" aria-pressed="true" data-copy="women">Mujer</button><button class="gender-tab" type="button" data-gender="men" aria-pressed="false" data-copy="men">Hombre</button></div>
        <div class="size-grid" role="group" aria-label="Available sizes" aria-live="polite">
          <button class="size-choice" type="button" data-size="4" aria-pressed="false">4</button><button class="size-choice" type="button" data-size="5" aria-pressed="false">5</button><button class="size-choice" type="button" data-size="6" aria-pressed="false" disabled aria-label="Size 6 unavailable">6</button><button class="size-choice" type="button" data-size="7" aria-pressed="true">7</button><button class="size-choice" type="button" data-size="8" aria-pressed="false">8</button><button class="size-choice" type="button" data-size="9" aria-pressed="false">9</button><button class="size-choice" type="button" data-size="10" aria-pressed="false">10</button><button class="size-choice" type="button" data-size="11" aria-pressed="false">11</button><button class="size-choice" type="button" data-size="12" aria-pressed="false">12</button><button class="size-choice" type="button" data-size="13" aria-pressed="false">13<img src="/images/crocs-prototype/notification.svg" alt=""></button>
        </div>
      </section>

      <div class="stock-note" role="status"><img src="/images/crocs-prototype/brand-mark.svg" alt=""><span data-copy="lowStock">Quedan unos pocos</span></div>
      <section class="purchase" aria-label="Purchase options">
        <button class="primary-action" id="add-to-cart" type="button" data-copy="addToCart">Agregar al carrito</button>
        <button class="pickup-action" id="pickup" type="button" data-copy="pickup">Retirar en Tienda</button>
        <strong class="purchase-price">$49.999</strong>
        <p class="product-caption"><span data-copy="displayColor">Color: Amarillo</span><br><span id="purchase-size">Talla: Mujer 7</span></p>
      </section>
      <div class="payment"><img src="/images/crocs-prototype/payment-icon.png" alt=""><span data-copy="payWith">Paga con</span><span class="addi">Addi</span><span data-copy="in">en</span><strong data-copy="installments">hasta 6 cuotas.</strong><button type="button" id="open-financing" data-copy="apply">Pide un cupo</button></div>
      <button class="children-link" type="button" id="children-link"><span data-copy="kids">Ir a Niños pequeños</span><span aria-hidden="true">→</span></button>
    </section>
  </main>

  <dialog class="dialog" id="prototype-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" id="close-dialog" type="button" aria-label="Close">×</button>
    <h2 id="dialog-title"></h2>
    <div id="dialog-content"></div>
    <button class="dialog-action" id="confirm-dialog" type="button" data-copy="gotIt">Entendido</button>
  </dialog>

  <script src="/prototypes/crocs-size-selector.js" defer></script>
</body>
</html>
